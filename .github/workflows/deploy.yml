---
name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        required: false
        description: "Reason for running this workflow"
      use_test_image:
        required: false
        type: boolean
        description: "Use base image testpr"
        default: false
      base_variant:
        required: false
        type: string
        description: "Debian codename to build on the next-release base images (e.g. forky). Blank builds on stable."
        default: ""

  workflow_call:
  repository_dispatch:
    types: build_on_aiscatcher_update

# Set workflow-wide environment variables
#  - REPO: repo name on dockerhub
#  - IMAGE: image name on dockerhub
env:
  #  DOCKERHUB_REPO: sdr-enthusiasts
  #  DOCKERHUB_IMAGE: shipxplorer
  GHCR_IMAGE: sdr-enthusiasts/shipxplorer
  GHCR_IMAGE2: sdr-enthusiasts/docker-shipfeeder
  GHCR_REGISTRY: ghcr.io

jobs:
  workflow-dispatch:
    name: Triggered via Workflow Dispatch?
    # only run this step if workflow dispatch triggered
    # log the reason the workflow dispatch was triggered
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.reason != ''
    runs-on: ubuntu-26.04
    steps:
      - name: Log dispatch reason
        env:
          INPUTS_REASON: ${{ github.event.inputs.reason }}
          INPUTS_BASE_VARIANT: ${{ github.event.inputs.base_variant }}
        run: |
          echo "Workflow dispatch reason: $INPUTS_REASON"
          echo "Base variant: ${INPUTS_BASE_VARIANT:-none (stable)}"

  build_and_push:
    name: Image Build & Push
    uses: sdr-enthusiasts/common-github-workflows/.github/workflows/sdre.yml@6fe78a4f1b7ab06ae480c7d2bb304f3a6c39055b # main
    with:
      push_enabled: true
      push_destinations: ghcr.io
      ghcr_repo_owner: ${{ github.repository_owner }}
      ghcr_repo: ${{ github.repository }}
      platform_linux_arm32v7_enabled: true
      # set build_latest to true if github.event.inputs.use_test_image is false
      build_latest: ${{ github.event.inputs.use_test_image == 'false' || github.event.inputs.use_test_image == ''  }}
      build_baseimage_test: ${{ github.event.inputs.use_test_image == 'true' }}
      build_baseimage_url: :base/:base-test-pr
      base_variant: ${{ github.event.inputs.base_variant }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
