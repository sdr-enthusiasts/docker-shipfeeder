---
name: Lint

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # =====================================================================
  # Primary Lint job
  # =====================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy-on-aiscatcher-changes.yml reads this digest to detect upstream
      # changes. Without it that workflow fails and AIS-catcher updates stop
      # triggering rebuilds. Keep this pattern in sync with that workflow.
      - name: Check ais-catcher image is digest-pinned
        run: |
          if ! grep -qP '(?<=ais-catcher:edge@)sha256:[0-9a-f]{64}' Dockerfile; then
            echo "::error file=Dockerfile::ghcr.io/jvde-github/ais-catcher:edge must be pinned by digest (FROM ghcr.io/jvde-github/ais-catcher:edge@sha256:...). See .github/workflows/deploy-on-aiscatcher-changes.yml"
            exit 1
          fi

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake pre-commit hooks
        run: nix develop -c pre-commit run --all-files
